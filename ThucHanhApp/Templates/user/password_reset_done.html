<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đã Gửi Email</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        p {
            color: #555;
            margin-bottom: 15px;
            font-size: 15px;
            line-height: 1.5;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .links {
            margin-top: 25px;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">📬</div>
        <h1>Kiểm Tra Email Của Bạn</h1>
        <p>Chúng tôi đã gửi một email có chứa hướng dẫn đặt lại mật khẩu của bạn.</p>
        <p>Nếu bạn không nhận được email, vui lòng đảm bảo rằng địa chỉ email bạn vừa nhập chính xác và kiểm tra thư mục
            Spam.</p>

        <div class="links">
            <a href="{% url 'user_login' %}">← Quay lại Đăng Nhập</a>
        </div>
    </div>
</body>

</html>
