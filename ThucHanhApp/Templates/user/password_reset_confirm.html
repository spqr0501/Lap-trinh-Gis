<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        p {
            color: #555;
            text-align: center;
            margin-bottom: 25px;
            font-size: 15px;
        }

        /* Clean up Django Form output */
        p label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 600;
            margin-top: 15px;
        }

        p input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        p input:focus {
            outline: none;
            border-color: #667eea;
        }

        span.helptext {
            display: none !important;
        }

        ul.errorlist {
            color: #e53e3e;
            list-style: none;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .links {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🔑 Đặt Lại Mật Khẩu</h1>
        {% if validlink %}
        <p>Vui lòng tạo một mật khẩu mới cho tài khoản của bạn.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Lưu Mật Khẩu Mới</button>
        </form>
        {% else %}
        <p style="color:#e53e3e; font-weight:bold;">Liên kết đặt lại mật khẩu đã hết hạn hoặc không hợp lệ!</p>
        <p>Vui lòng gửi lại yêu cầu để nhận đường dẫn mới.</p>
        <div class="links"><a href="{% url 'password_reset' %}">Thử lại</a></div>
        {% endif %}
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Find all auto-generated password inputs
            var pwInputs = document.querySelectorAll('input[type="password"]');
            pwInputs.forEach(function (inp) {
                // Style input
                inp.style.paddingRight = '40px';

                // Create wrapper
                var wrapper = document.createElement('div');
                wrapper.style.position = 'relative';

                // Wrap input
                inp.parentNode.insertBefore(wrapper, inp);
                wrapper.appendChild(inp);

                // Create eye icon
                var toggle = document.createElement('span');
                toggle.textContent = '👁️';
                toggle.style.position = 'absolute';
                toggle.style.right = '10px';
                toggle.style.top = '50%';
                toggle.style.transform = 'translateY(-50%)';
                toggle.style.cursor = 'pointer';
                toggle.style.fontSize = '16px';
                toggle.style.color = '#999';
                toggle.style.userSelect = 'none';

                // Add toggle logic
                toggle.addEventListener('click', function () {
                    if (inp.type === 'password') {
                        inp.type = 'text';
                        this.textContent = '🙈';
                    } else {
                        inp.type = 'password';
                        this.textContent = '👁️';
                    }
                });

                wrapper.appendChild(toggle);
            });
        });
    </script>
</body>

</html>
