<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng Ký</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .links {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .messages {
            margin-bottom: 15px;
        }

        .messages li {
            list-style: none;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 5px;
        }

        .messages .error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .messages .success {
            background: #efe;
            color: #3a3;
            border: 1px solid #cfc;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>📝 Đăng Ký</h1>

        {% if messages %}
        <ul class="messages">
            {% for msg in messages %}
            <li class="{{ msg.tags }}">{{ msg }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="ho_ten">Họ và tên:</label>
                <input type="text" id="ho_ten" name="ho_ten" placeholder="VD: Nguyễn Văn A">
            </div>
            <div class="form-group">
                <label for="username">Tên đăng nhập:</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="password2">Nhập lại mật khẩu:</label>
                <input type="password" id="password2" name="password2" required>
            </div>
            <button type="submit" class="btn">Đăng Ký</button>
        </form>

        <div class="links">
            Đã có tài khoản? <a href="{% url 'user_login' %}">Đăng nhập</a>
            <br><br>
            <a href="{% url 'trang_chu' %}">← Về trang chủ</a>
        </div>
    </div>
</body>

</html>
